name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, type-check, security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy src/ --ignore-missing-imports --strict

      - name: Bandit security scan
        # Fail on medium or higher severity issues.
        # -ll flag: report LOW and above; the CI gate is set to MEDIUM (-l).
        run: bandit -r src/ -ll -x src/models/ecg_anomaly/train.py
        # train.py uses subprocess for SageMaker tooling; excluded from scan scope

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build-lambda:
    name: Build Lambda deployment package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies into package dir
        run: |
          pip install -r requirements.txt --target ./package
          cp -r src ./package/

      - name: Zip deployment package
        run: |
          cd package
          zip -r ../lambda_deployment.zip .
          cd ..
          echo "Package size: $(du -sh lambda_deployment.zip | cut -f1)"

      - name: Upload Lambda package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment-${{ github.sha }}
          path: lambda_deployment.zip
          retention-days: 30
